models:
  # ---- TurboQuantLoader (local llama-server proxy on port 7432) ----
  # Start TurboQuantLoader before using: .\run.ps1 from J:\Projects\TurboQuantLoader
  # Model name must match the .gguf file stem returned by GET /v1/models.
  # single_model_only is overridden to false below — TQL manages its own lifecycle.
  - name: Qwen3.6-27B-Q6_K
    type: local
    provider: turboquant  # TQL auto-switches models; name must match TQL [[models]] registry or models_dir file stem
    endpoint: ${TURBOQUANT_URL:-http://127.0.0.1:7432}
    # TurboQuantLoader's config.toml sets context_size = 131072 (halved from
    # 262144 for VRAM headroom) AND --parallel 2, so llama-server splits that
    # across 2 slots — the real per-request ceiling is 131072 / 2 = 65536.
    # 262144 here was stale and let context_builder's budgeting (which reads
    # this field directly) size prompts up to 4x too large, causing
    # "exceeds the available context size (65536 tokens)" failures under
    # concurrent requests (logs/api-20260819-201238.log, task_num 7).
    context_window: 65536
    is_coding_optimized: true
    recommended_for: [coding, code_review, test_generation, planning, research]
    rate_limit_rpm: 60

  - name: Qwen3.8-27B-Q4_K_S
    type: local
    provider: turboquant  # TQL auto-switches models; name must match TQL [[models]] registry or models_dir file stem
    endpoint: ${TURBOQUANT_URL:-http://127.0.0.1:7432}
    # TurboQuantLoader's config.toml sets context_size = 131072 (halved from
    # 262144 for VRAM headroom) AND --parallel 2, so llama-server splits that
    # across 2 slots — the real per-request ceiling is 131072 / 2 = 65536.
    # 262144 here was stale and let context_builder's budgeting (which reads
    # this field directly) size prompts up to 4x too large, causing
    # "exceeds the available context size (65536 tokens)" failures under
    # concurrent requests (logs/api-20260819-201238.log, task_num 7).
    context_window: 65536
    is_coding_optimized: true
    recommended_for: [coding, code_review, test_generation, planning, research]
    rate_limit_rpm: 60
    # Thinking is enabled (enable_thinking unset). The <think> trace on
    # non-trivial coding tasks can run past the old 8192 default, cutting the
    # response off before the answer (see logs/api-20260818-192257.log —
    # 5 straight developer-role failures with reasoning_content populated and
    # content empty). Raised to give thinking + answer both room.
    max_tokens: 24576
    # Thinking + a 24576-token response budget legitimately runs past the
    # model_router default of 600s (see logs/api-20260819-201238.log —
    # developer-role and tester-role generate() calls both hit
    # ollama_hard_timeout at 600s before this was raised per-role).
    timeout_secs: 1500

  - name: qwen3.6-27b
    type: local
    provider: lmstudio   # lmstudio | ollama | llama_cpp
    # Set LM_STUDIO_URL in .env to override; falls back to localhost:1234
    endpoint: ${LM_STUDIO_URL:-http://127.0.0.1:1234}
    context_window: 262144
    is_coding_optimized: true
    recommended_for: [coding, code_review, test_generation, planning, research]
    rate_limit_rpm: 120

  - name: qwen3.6-35b-a3b
    type: local
    provider: lmstudio   # lmstudio | ollama | llama_cpp
    # Set LM_STUDIO_URL in .env to override; falls back to localhost:1234
    endpoint: ${LM_STUDIO_URL:-http://127.0.0.1:1234}
    context_window: 262144
    is_coding_optimized: true
    recommended_for: [coding, code_review, test_generation, planning, research]
    rate_limit_rpm: 120

  - name: google_gemma-4-31b-it
    type: local
    provider: lmstudio
    endpoint: ${LM_STUDIO_URL:-http://127.0.0.1:1234}
    context_window: 109999
    is_coding_optimized: true
    recommended_for: [coding, code_review, test_generation, planning, research]
    rate_limit_rpm: 120

  - name: google/gemma-4-26b-a4b
    type: local
    provider: lmstudio
    endpoint: ${LM_STUDIO_URL:-http://127.0.0.1:1234}
    context_window: 109148
    is_coding_optimized: true
    recommended_for: [coding, code_review, test_generation, planning, research]
    rate_limit_rpm: 120

  - name: gemma-4-31b-it
    type: local
    provider: lmstudio
    endpoint: ${LM_STUDIO_URL:-http://127.0.0.1:1234}
    context_window: 109148
    is_coding_optimized: true
    recommended_for: [coding, code_review, test_generation, planning, research]
    rate_limit_rpm: 120
    
    
  # ---- OpenRouter models (set OPENROUTER_API_KEY in .env to activate) ----
  # OpenRouter speaks the OpenAI-compatible /v1/chat/completions API.
  # Use any model slug from https://openrouter.ai/models as the `name`.
  - name: google/gemma-4-31b-it:free
    type: remote
    endpoint: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    context_window: 262144
    is_coding_optimized: true
    recommended_for: [coding, code_review, planning, research, chat]
    rate_limit_rpm: 60

  - name: google/gemma-4-26b-a4b-it:free
    type: remote
