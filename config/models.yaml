rate_limiting:
  global_rpm: 100
  burst_allowance: 1.5
  backoff_multiplier: 2
  max_backoff_seconds: 60

defaults:
  coding_model: Qwen3.8-27B-Q4_K_S
  planning_model: Qwen3.8-27B-Q4_K_S
  fallback_model: openai/gpt-oss-120b:free
  # verify_model: <model-name>  # uncomment to route verification (verifier_agent)
  #   to a different/stronger model than development — otherwise it defaults
  #   to the same coding-optimized model as coding_model.

  # Local model runtime behaviour.
  # single_model_only: false — TurboQuantLoader manages its own lifecycle and
  #   does not implement LM Studio's load/unload API.  Setting true would cause
  #   404 errors against port 7432.  If switching back to LM Studio as primary,
  #   set this to true and update coding_model / planning_model above.
  # load_timeout_secs: how long to poll after triggering a load before
  #   giving up and falling back to remote.
  # load_poll_interval_secs: how often to check if the model is loaded.
  # max_load_attempts: how many load+poll cycles before switching to remote.
  local_runtime:
    single_model_only: false
    load_timeout_secs: 300
    load_poll_interval_secs: 10
    max_load_attempts: 2
