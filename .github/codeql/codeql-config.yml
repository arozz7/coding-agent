name: "CodeQL config"

# py/path-injection generates only false positives in this codebase:
# all path operations use validated names (regex + basename + is_relative_to
# guards), but CodeQL tracks taint through os.getenv/instance-attributes
# all the way to any path join and does not model our sanitizers.
# 40 alerts raised to date; 36 dismissed as false positive, 0 true positives.
query-filters:
  - exclude:
      id: py/path-injection
